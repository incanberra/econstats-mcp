name: Checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: docker build -t econstats-hosted .
      - name: Refuse an unprotected production start
        run: |
          if docker run --rm econstats-hosted; then
            echo "Unprotected production container unexpectedly started"
            exit 1
          fi
      - name: Run container and verify hosted protocol
        env:
          MCP_AUTH_TOKEN: ci-only-non-secret-token-for-offline-container-checks
          ECONSTATS_CHECK_TOKEN: ci-only-non-secret-token-for-offline-container-checks
          ECONSTATS_CHECK_URL: http://127.0.0.1:3000
        run: |
          docker run -d --memory=256m --cpus=0.1 --name econstats-check -p 127.0.0.1:3000:3000 -e MCP_AUTH_MODE=bearer -e MCP_AUTH_TOKEN econstats-hosted
          bun run check:hosted
          test "$(docker exec econstats-check id -u)" != "0"
          docker stop -t 15 econstats-check
          test "$(docker inspect -f '{{.State.ExitCode}}' econstats-check)" = "0"
      - name: Container diagnostics
        if: failure()
        run: docker logs econstats-check || true
