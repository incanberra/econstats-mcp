name: Comtrade public live check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/core/comtrade.ts
      - scripts/check-comtrade-live.ts
      - .github/workflows/comtrade-public.yml
jobs:
  public-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-comtrade-live.ts
        env:
          ECONSTATS_COMTRADE_LIVE: 'true'
